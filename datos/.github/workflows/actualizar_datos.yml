name: Reentrenamiento Automatico Win Predictor

on:
  schedule:
    # Se ejecuta todos los lunes a las 03:00 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  reentrenar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/checkout@v3
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install pandas numpy scikit-learn joblib requests

      - name: 1. Descargar datos actualizados
        run: python 1_obtener_datos.py

      - name: 2. Preparar métricas y features
        run: python 2_preparar_datos.py

      - name: 3. Reentrenar modelo y guardar archivo .pkl
        run: python 3_entrenar_y_predecir.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name 'Bot Win Predictor'
          git config --global user.email 'bot@winpredictor.com'
          git add .
          git commit -m "Auto-reentrenamiento: Modelo actualizado con la última fecha" || exit 0
          git push
