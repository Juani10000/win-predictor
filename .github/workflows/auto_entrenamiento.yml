name: Auto Aprendizaje IA LPF

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 02:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

# Otorga permisos de escritura al bot de GitHub Actions para guardar los cambios
permissions:
  contents: write

jobs:
  train-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          pip install pandas numpy scikit-learn requests joblib

      - name: Ejecutar Auto-Aprendizaje
        run: python train.py

      - name: Guardar Cambios del Modelo y Dataset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Agrega los archivos únicamente si fueron generados por train.py
          if [ -f dataset_historico.csv ]; then git add dataset_historico.csv; fi
          if [ -f modelo_ia_lpf.pkl ]; then git add modelo_ia_lpf.pkl; fi
          
          git commit -m "Auto-reentrenamiento de la IA con resultados de la fecha" || exit 0
          git push
