name: Actualizar Datos Diariamente

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  actualizar-todo:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar mi código
        uses: actions/checkout@v3

      - name: 🐍 Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📚 Instalar librerías
        run: pip install -r requirements.txt

      - name: ⚽ Descargar partidos y calcular rachas
        run: |
          python 1_obtener_datos.py
          python 2_preparar_datos.py

      - name: 💾 Guardar los nuevos datos en GitHub
        run: |
          git config --global user.name "Robot Automático"
          git config --global user.email "bot@winpredictor.com"
          git add datos/*
          git commit -m "🤖 Actualización diaria de partidos y rachas" || echo "No hay partidos nuevos hoy"
          git push
