name: Actualizar Datos Win Predictor

on:
  schedule:
    # Se ejecuta a las 3:00 AM, 3:00 PM, 7:00 PM y 11:00 PM (Hora Argentina / UTC-3)
    - cron: '0 2,6,18,22 * * *'
  
  # Permite ejecutarlo manualmente desde GitHub cuando quieras
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar script de recolección de datos
        run: |
          # Reemplazá 'scraper.py' por el nombre exacto de tu script que genera el CSV
          python scraper.py

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add datos_procesados.csv
          git commit -m "Auto-update datos_procesados.csv" || exit 0
          git push
