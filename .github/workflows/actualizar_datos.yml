name: Actualizar Datos

on:
  workflow_dispatch:

jobs:
  actualizar-todo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar mi código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib beautifulsoup4

      - name: Descargar partidos y calcular rachas
        run: |
          python 1_obtener_datos.py

      - name: Guardar los nuevos datos en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Actualización automática de datos"
          git push
