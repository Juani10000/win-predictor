name: Actualizar Datos Diarios

on:
  schedule:
    # Esto es el reloj automático: se ejecuta todos los días a las 06:00 AM (UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Esto deja el botón manual para que lo pruebes ahora

jobs:
  actualizar-espn:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib beautifulsoup4

      - name: Extraer la tabla de ESPN
        run: |
          python 1_obtener_datos.py

      - name: Guardar la tabla nueva en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tabla_anual.csv
          git diff --staged --quiet || git commit -m "🤖 Actualización automática diaria de posiciones"
          git push
