name: Actualizar Datos Diarios

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 06:00 UTC (3:00 AM Argentina)
    - cron: '0 6 * * *'
  workflow_dispatch: # Mantiene la opción de ejecutarlo manualmente cuando quieras

jobs:
  actualizar-todo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas lxml

      - name: Ejecutar scraper de Cancha Llena
        run: |
          python 1_obtener_datos.py

      - name: Guardar datos en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Actualización diaria de datos Cancha Llena"
          git push
