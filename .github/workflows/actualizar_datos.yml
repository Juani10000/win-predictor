name: Actualizar Datos de Fútbol

on:
  schedule:
    # Se ejecuta todos los días a las 09:00 UTC (06:00 AM hora de Argentina)
    - cron: '0 1,15,16,17,18,19,20,21,22,23 * * *'
  workflow_dispatch: # Mantiene el botón para ejecutar el script manualmente

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib

      - name: Ejecutar el script para obtener la Tabla Anual
        run: python 1_obtener_datos.py

      - name: Guardar los nuevos datos en GitHub
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add *.csv
          git commit -m "🤖 Actualización automática diaria de la Tabla Anual" || echo "No hay datos nuevos para actualizar"
          git push
