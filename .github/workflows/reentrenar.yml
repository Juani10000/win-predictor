name: Reentrenamiento Automático de IA

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# 👇 ESTO ES LO QUE FALTABA: Darle permiso al bot para guardar los archivos
permissions:
  contents: write

jobs:
  entrenar-ia:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: 🐍 Preparar entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install lxml html5lib joblib
          pip install -r requirements.txt

      - name: 🚀 Ejecutar Pipeline
        run: |
          python 1_obtener_datos.py
          python 2_preparar_datos.py
          python 3_entrenar_y_predecir.py

      - name: 💾 Guardar modelo y cambios en GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "🤖 Reentrenamiento automático completado" || echo "Sin cambios"
          git push
