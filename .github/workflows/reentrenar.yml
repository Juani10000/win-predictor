name: Reentrenamiento Automático de IA

on:
  schedule:
    # Se ejecuta todos los lunes a las 03:00 AM (UTC)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Botón manual para cuando quieras ejecutarlo a mano

jobs:
  entrenar-ia:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Descargar el código del repositorio
      uses: actions/checkout@v3

    - name: 🐍 Preparar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Instalar dependencias
      run: |
        pip install pandas numpy scikit-learn joblib requests beautifulsoup4

    - name: 🌐 PASO 1: Obtener datos frescos de partidos y tabla
      run: |
        python 1_obtener_datos.py

    - name: 🧠 PASO 2: Reentrenar el Modelo de IA
      run: |
        python entrenar_modelo.py

    - name: 💾 Guardar datos y modelo actualizado en GitHub
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add datos_procesados.csv modelo_entrenado.pkl
        git commit -m "🤖 Datos y Modelo actualizados automáticamente" || echo "Sin cambios"
        git push
