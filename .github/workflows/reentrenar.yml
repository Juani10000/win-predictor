name: Reentrenamiento Automático de IA

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  entrenar-ia:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v3

      - name: Preparar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Reentrenar IA
        run: |
          python 1_obtener_datos.py
          python 2_preparar_datos.py
          python 3_entrenar_y_predecir.py

      - name: Guardar cambios
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Actualizacion automatica de IA" || echo "Sin cambios"
          git push
