name: Reentrenamiento Automático de IA 

on:
  schedule:
    # Se ejecuta todos los lunes a las 03:00 AM (UTC)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Botón manual para cuando quieras ejecutarlo a mano

jobs:
  entrenar-ia:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Descargar el código del repositorio
      uses: actions/checkout@v3

    - name: 🐍 Preparar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Instalar dependencias
      run: |
        pip install -r requirements.txt

    - name: 🚀 PASO 1: Ejecutar Pipeline de Datos y Entrenamiento
      run: |
        python 1_obtener_datos.py
        python 2_preparar_datos.py
        python 3_entrenar_y_predecir.py

    - name: 💾 Guardar datos y modelo actualizado en GitHub
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add .
        git commit -m "🤖 Pipeline automático: Datos y Modelo actualizados" || echo "Sin cambios"
        git push
