name: Reentrenar Modelo IA LPF

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  reentrenar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar script de entrenamiento
        run: python train.py

      - name: Confirmar y subir cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: reentrenamiento automático de IA" && git push)
